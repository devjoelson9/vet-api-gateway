events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # --------------------------------------------------
    # Upstreams (nomes dos containers na rede vet-network)
    # --------------------------------------------------
    upstream servico_identidade  { server servico-identidade:8080; }
    upstream servico_clinico     { server servico-clinico:8080; }
    upstream servico_agendamento { server servico-agendamento:8080; }
    upstream servico_faturamento { server servico-faturamento:8080; }
    upstream interface_web       { server interface-web:80; }

    server {
        listen 80;
        server_name localhost;

        # Configurações globais de Proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;

        client_max_body_size 10m;

        # --------------------------------------------------
        # Frontend (SPA React)
        # --------------------------------------------------
        location / {
            proxy_pass http://interface_web;
        }

        # --------------------------------------------------
        # API — prefixo único consumido pelo frontend: /api/v1/**
        # O path é repassado sem rewrite, pois os serviços já
        # expõem seus controllers em /api/v1/**.
        # --------------------------------------------------

        # Identidade e Cadastro
        location /api/v1/auth          { proxy_pass http://servico_identidade; }
        location /api/v1/tutores       { proxy_pass http://servico_identidade; }
        location /api/v1/admin         { proxy_pass http://servico_identidade; }
        location /api/v1/recepcionista { proxy_pass http://servico_identidade; }
        location /api/v1/veterinario   { proxy_pass http://servico_identidade; }
        location /api/v1/veterinarios  { proxy_pass http://servico_identidade; }

        # Clínico
        location /api/v1/atendimentos    { proxy_pass http://servico_clinico; }
        location /api/v1/medicamentos    { proxy_pass http://servico_clinico; }
        location /api/v1/catalogo-itens  { proxy_pass http://servico_clinico; }

        # Faturamento: pagamentos de um atendimento.
        # A regex tem precedência sobre o prefixo /api/v1/atendimentos acima,
        # encaminhando somente as rotas de pagamento para o serviço de faturamento.
        location ~ ^/api/v1/atendimentos/[0-9]+/pagamentos(/.*)?$ {
            proxy_pass http://servico_faturamento;
        }

        # Agendamento
        location /api/v1/agendamentos    { proxy_pass http://servico_agendamento; }
        location /api/v1/disponibilidades { proxy_pass http://servico_agendamento; }

        # Health check usado pela tela de configuração do frontend
        location = /api/actuator/health {
            proxy_pass http://servico_agendamento/actuator/health;
        }

        # Qualquer outra rota de API não mapeada retorna 404 explícito
        location /api/ {
            return 404 '{"status":404,"error":"Not Found","message":"Rota de API não mapeada no gateway"}';
        }
    }
}
