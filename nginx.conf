events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Formato de Logs para Diagnóstico
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Bloco principal do servidor
    server {
        listen 80;
        server_name localhost;

        # Configurações globais de Proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # --------------------------------------------------
        # 1. Roteamento do Frontend (Interface Web)
        # --------------------------------------------------
        location / {
            proxy_pass http://interface-web:80/;
        }

        # --------------------------------------------------
        # 2. Microsserviço de Identidade e Cadastro (/identidade)
        # --------------------------------------------------
        location /identidade/ {
            proxy_pass http://servico-identidade:8080/;
        }

        # --------------------------------------------------
        # 3. Microsserviço Clínico (/clinico)
        # --------------------------------------------------
        location /clinico/ {
            proxy_pass http://servico-clinico:8080/;
        }

        # --------------------------------------------------
        # 4. Microsserviço de Agendamento (/agendamentos)
        # --------------------------------------------------
        location /agendamentos/ {
            proxy_pass http://servico-agendamento:8080/;
        }

        # --------------------------------------------------
        # 5. Microsserviço de Faturamento (/faturamento)
        # --------------------------------------------------
        location /faturamento/ {
            proxy_pass http://servico-faturamento:8080/;
        }

        # --------------------------------------------------
        # Tratamento Básico de Erros
        # --------------------------------------------------
        error_page 500 502 503 504 /5x.html;
        location = /5x.html {
            root /usr/share/nginx/html;
        }
    }
}